<template>
    <lightning-card title="Stock Level" icon-name="standard:product">
        <lightning-button
            slot="actions"
            label="All Vehicle Models"
            icon-name="utility:back"
            onclick={goToModelList}
        ></lightning-button>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={hasData}>
                <div class={badgeClass} role="status">
                    <span class="dot"></span>
                    <span class="label">{message}</span>
                </div>
            </template>
            <template lwc:elseif={vehicleModel.error}>
                <p class="slds-text-color_error">Stock level could not be loaded.</p>
            </template>
        </div>
    </lightning-card>
</template>
